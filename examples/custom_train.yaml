model_name_or_path: "meta-llama/Llama-2-7b-hf"
model_revision: "main"
cache_dir: null
torch_dtype: "auto"
use_flash_attn: "auto"

dataset: "custom_dataset"
dataset_dir: "data"
cutoff_len: 2048
train_on_prompt: false
template: "vicuna"

do_train: true
output_dir: "output/custom_train"
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2e-4
weight_decay: 0.01
num_train_epochs: 3
max_steps: -1
lr_scheduler_type: "cosine"
warmup_steps: 100
logging_steps: 10
save_steps: 100
save_total_limit: 3
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

lora_rank: 64
lora_alpha: 16
lora_dropout: 0.05
lora_target: "q_proj,v_proj" 