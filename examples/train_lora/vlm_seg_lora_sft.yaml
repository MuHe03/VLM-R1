### model
model_type: vlm_seg
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
seg_decoder_path: facebook/mask2former-swin-large-ade-semantic
image_max_pixels: 262144
trust_remote_code: true
template: vlm_seg
num_classes: 151
seg_hidden_dim: 256

# continue_training: true # uncomment when resuming from a checkpoint

### method
stage: sft
do_train: true
finetuning_type: lora
freeze_language_model: false
lora_r: 32
lora_alpha: 64
target_modules: ["q_proj","k_proj","v_proj","o_proj"]   # leave vision tower frozen
freeze_vision_tower: true
freeze_multi_modal_projector: true
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: custom_dataset
dataset_dir: data
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 48
dataloader_num_workers: 24

### output
output_dir: saves/custom_seg_1/lora/sft/llm_only/
logging_steps: 10
save_steps: 10000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### segmentation specific
# seg_token_idx: 151858  # 特殊分割token的索引
use_rle_masks: true  # 使用RLE编码的掩码
mask_format: "rle"  # 掩码格式为RLE
output_format: "rle"  # 输出格式为RLE
mask_threshold: 0.5  # 二值化阈值
label_encoding: "categorical"  # 标签编码方式：binary/categorical

disable_gradient_checkpointing: false
use_reentrant_gc: true