### model
model_type: vlm_seg
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
seg_decoder_path: facebook/mask2former-swin-base
image_max_pixels: 262144
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false

### dataset
dataset: custom_dataset
dataset_dir: data
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2
template: vicuna

### output
output_dir: saves/custom_seg/full/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### segmentation specific
seg_token_idx: 151858  # 特殊分割token的索引
use_rle_masks: true  # 使用RLE编码的掩码
mask_format: "rle"  # 掩码格式为RLE
output_format: "rle"  # 输出格式为RLE
mask_threshold: 0.5  # 二值化阈值
label_encoding: "binary"  # 标签编码方式：binary/categorical
num_classes: 1  # 分割类别数
ignore_label: 255  # 忽略的标签值 