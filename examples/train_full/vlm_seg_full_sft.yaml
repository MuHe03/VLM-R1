### model
model_type: vlm_seg
model_name_or_path: saves/custom_seg_2_2/full/sft/checkpoint-15000
seg_decoder_path: facebook/mask2former-swin-large-ade-semantic
image_max_pixels: 262144
trust_remote_code: true
template: vlm_seg
num_classes: 151
seg_hidden_dim: 256

continue_training: true # uncomment when resuming from a checkpoint

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: custom_dataset
dataset_dir: data
cutoff_len: 2048
# max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 48
dataloader_num_workers: 24

### output
output_dir: saves/custom_seg_2_3/full/sft
logging_steps: 100
save_steps: 10000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### segmentation specific
# seg_token_idx: 151858  # 特殊分割token的索引
use_rle_masks: true  # 使用RLE编码的掩码
mask_format: "rle"  # 掩码格式为RLE
output_format: "rle"  # 输出格式为RLE
mask_threshold: 0.5  # 二值化阈值
label_encoding: "categorical"  # 标签编码方式：binary/categorical

disable_gradient_checkpointing: true   # turns CP off completely :contentReference[oaicite:0]{index=0}
use_reentrant_gc: false                # (optional) keep CP on but non-re-entrant :contentReference[oaicite:1]{index=1}